<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>숫자 올리기</title>

  <!-- ===== CSS: 화면을 꾸미는 부분 ===== -->
  <style>
    /* 페이지 전체: 내용을 화면 가운데에 놓는다 */
    body {
      font-family: sans-serif;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    /* 숫자를 크게 보여주는 부분 */
    #number {
      font-size: 80px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 24px;
    }

    /* 버튼 모양 */
    button {
      font-size: 24px;
      padding: 12px 32px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }

    /* 마우스를 올리면 색이 조금 진해진다 */
    button:hover {
      background: #2563eb;
    }

    /* 축하 메시지: 평소엔 자리를 차지한 채 투명하게 숨어 있다가 숫자가 10이 되면 나타난다 */
    #congrats {
      font-size: 28px;
      font-weight: bold;
      color: #d97706;
      height: 40px;
      margin-bottom: 8px;
      opacity: 0;
    }
    #congrats.show {
      opacity: 1;
    }

    /* 초기화 버튼은 회색으로 구분하고, 두 버튼 사이에 간격을 준다 */
    button.reset {
      background: #6b7280;
      margin-top: 12px;
    }
    button.reset:hover {
      background: #4b5563;
    }
  </style>
</head>
<body>

  <!-- ===== HTML: 화면에 보이는 요소 ===== -->
  <!-- 숫자가 표시될 곳 (처음 값은 0) -->
  <div id="number">0</div>

  <!-- 숫자가 10이 되면 보이는 축하 메시지 -->
  <div id="congrats">🎉 축하합니다! 10을 달성했어요! 🎉</div>

  <!-- 누르면 숫자가 올라가는 버튼 -->
  <button id="plusBtn">+1</button>

  <!-- 누르면 지금 숫자가 2배가 되는 버튼 -->
  <button id="doubleBtn" class="reset">x2</button>

  <!-- 누르면 숫자가 0으로 돌아가는 초기화 버튼 -->
  <button id="resetBtn" class="reset">초기화</button>

  <!-- ===== JavaScript: 동작을 담당하는 부분 ===== -->
  <script>
    // 현재 숫자를 저장하는 변수 (처음엔 0)
    let count = 0;

    // HTML에서 숫자 표시 영역과 버튼을 찾아 변수에 담는다
    const numberEl = document.getElementById("number");
    const button = document.getElementById("plusBtn");

    // 랜덤 색을 만들어 주는 함수
    // hsl(색상, 채도, 밝기): 색상을 0~359 중 아무 값으로 뽑고, 밝기는 높게 해서 글자가 잘 보이게 한다
    function randomColor() {
      const hue = Math.floor(Math.random() * 360);   // 0 이상 360 미만의 랜덤 정수
      return "hsl(" + hue + ", 70%, 80%)";
    }

    // 축하 메시지 영역을 찾아 변수에 담는다
    const congratsEl = document.getElementById("congrats");

    // 숫자가 정확히 10일 때만 축하 메시지를 보여 주고, 아니면 숨기는 함수
    function updateCongrats() {
      if (count === 10) {
        congratsEl.classList.add("show");     // show 클래스를 붙이면 메시지가 나타난다
      } else {
        congratsEl.classList.remove("show");  // 떼면 다시 사라진다
      }
    }

    // 버튼을 클릭할 때마다 아래 함수가 실행된다
    button.addEventListener("click", function () {
      count = count + 1;               // 숫자를 1 증가시키고
      numberEl.textContent = count;    // 화면의 글자를 새 숫자로 바꾼다
      document.body.style.background = randomColor();  // 배경색을 랜덤 색으로 바꾼다
      updateCongrats();                // 10이 되었는지 확인한다
    });

    // 2배 버튼을 찾아 변수에 담는다
    const doubleButton = document.getElementById("doubleBtn");

    // 2배 버튼을 클릭하면 지금까지 쌓인 숫자에 2를 곱한다
    doubleButton.addEventListener("click", function () {
      count = count * 2;               // 숫자를 2배로 만들고
      numberEl.textContent = count;    // 화면에도 새 숫자를 보여 준다
      updateCongrats();                // 5에서 x2를 눌러 10이 될 수도 있으니 확인한다
    });

    // 초기화 버튼을 찾아 변수에 담는다
    const resetButton = document.getElementById("resetBtn");

    // 초기화 버튼을 클릭하면 숫자를 처음 값인 0으로 되돌린다
    resetButton.addEventListener("click", function () {
      count = 0;                       // 저장된 숫자를 0으로 바꾸고
      numberEl.textContent = count;    // 화면에도 0을 보여 준다
      document.body.style.background = "";  // 배경색도 처음 색(CSS에 적은 색)으로 되돌린다
      updateCongrats();                // 숫자가 0이 되었으니 축하 메시지를 숨긴다
    });
  </script>
</body>
</html>
